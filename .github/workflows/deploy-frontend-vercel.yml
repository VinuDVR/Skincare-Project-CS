name: Deploy Flutter web to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/web_application/**'
      - 'vercel.json'
      - '.github/workflows/deploy-frontend-vercel.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web_application
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Flutter web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Prepare Vercel static output
        run: |
          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
